services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pos_system_pgsql}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network

  # Backend PHP-FPM Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./backend:/var/www/html:delegated
    command: >
      sh -c "chown -R www-data:www-data storage bootstrap/cache && /usr/bin/supervisord -c /etc/supervisord.conf"
    networks:
      - pos-network
    depends_on:
      - db

  # Nginx Service for Backend
  nginx:
    image: nginx:alpine
    container_name: pos-nginx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pos-network
    depends_on:
      - backend

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge
